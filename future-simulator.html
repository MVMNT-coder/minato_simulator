<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTURE SIMULATOR</title>
<style>
/* ============================================================
   FUTURE SIMULATOR — 通信型ライフシミュレーション（作り込み版）
   暗く静かなSFインターフェース / 展示モニター(16:9)優先
   ============================================================ */

:root {
  --bg-deep:   #04070d;
  --panel:     rgba(14, 22, 38, 0.72);
  --line:      rgba(120, 200, 220, 0.22);
  --text:      #dfeaf2;   /* 青みのある白 */
  --text-dim:  #8fa4b5;
  --mint:      #7df0d4;
  --cyan:      #6fd7ff;
  --blue-pale: #a9c8ff;
  --danger:    #ff5a6e;
  --acc:       var(--mint); /* ステージごとに上書きされるアクセント色 */
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

body {
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, rgba(30, 60, 100, 0.25), transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 120%, rgba(20, 70, 80, 0.18), transparent 55%),
    var(--bg-deep);
  color: var(--text);
  font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 展示モニター用：全画面に薄い走査線 */
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom,
    transparent 0 3px, rgba(255,255,255,0.012) 3px 4px);
  z-index: 999;
}

#app {
  height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 4vh 6vw;
  position: relative;
}

/* ---------- 画面遷移フェード ---------- */
.screen {
  width: 100%; max-width: 1280px;
  display: flex; flex-direction: column; align-items: center;
  animation: screenIn 0.7s ease both;
}
@keyframes screenIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.scrollable {
  max-height: 92vh; overflow-y: auto; padding: 2vh 8px;
}
.scrollable::-webkit-scrollbar { width: 6px; }
.scrollable::-webkit-scrollbar-thumb { background: rgba(120,200,220,0.2); border-radius: 3px; }

/* ---------- タイポグラフィ ---------- */
.eyebrow {
  font-size: 13px; letter-spacing: 0.45em;
  color: var(--acc); text-transform: uppercase;
  margin-bottom: 18px; opacity: 0.9;
}
.h-large {
  font-size: clamp(34px, 4.6vw, 64px); font-weight: 300;
  letter-spacing: 0.22em; text-align: center; line-height: 1.35;
}
.h-mid {
  font-size: clamp(20px, 2.2vw, 30px); font-weight: 400;
  letter-spacing: 0.12em; text-align: center; line-height: 1.8;
}
.lead {
  font-size: clamp(15px, 1.3vw, 18px); color: var(--text-dim);
  letter-spacing: 0.08em; line-height: 2.1; text-align: center;
}

/* ---------- ボタン ---------- */
.btn {
  appearance: none;
  background: rgba(125, 240, 212, 0.04);
  border: 1px solid var(--mint); color: var(--mint);
  font-family: inherit;
  font-size: clamp(15px, 1.25vw, 18px);
  letter-spacing: 0.3em; text-indent: 0.3em;
  padding: 20px 64px; cursor: pointer; border-radius: 2px;
  transition: box-shadow 0.35s, background 0.35s, opacity 0.3s;
}
.btn:hover:not(:disabled) {
  background: rgba(125, 240, 212, 0.12);
  box-shadow: 0 0 22px rgba(125,240,212,0.45), inset 0 0 14px rgba(125,240,212,0.15);
}
.btn:disabled { opacity: 0.28; cursor: not-allowed; }
.btn-sub {
  border-color: rgba(143,164,181,0.5); color: var(--text-dim); background: transparent;
}
.btn-sub:hover:not(:disabled) {
  box-shadow: 0 0 14px rgba(143,164,181,0.3); background: rgba(143,164,181,0.08);
}
.btn-jp { display: block; font-size: 11px; letter-spacing: 0.2em; color: var(--text-dim); margin-top: 6px; }
.actions {
  margin-top: 5vh; display: flex; gap: 24px;
  align-items: center; justify-content: center; flex-wrap: wrap;
}

/* ---------- 待機画面 ---------- */
.standby-title {
  font-size: clamp(44px, 6.5vw, 96px); font-weight: 200;
  letter-spacing: 0.28em; text-indent: 0.28em; text-align: center;
  text-shadow: 0 0 40px rgba(111,215,255,0.35);
}
.standby-meta {
  margin-top: 4vh; text-align: center;
  font-size: 13px; letter-spacing: 0.35em;
  color: var(--text-dim); line-height: 2.6;
}
.standby-meta em { font-style: normal; color: var(--cyan); }
.connect-btn {
  margin-top: 7vh; font-size: 20px; padding: 24px 96px;
  animation: startPulse 3.2s ease-in-out infinite;
}
@keyframes startPulse {
  0%,100% { box-shadow: 0 0 6px rgba(125,240,212,0.15); }
  50%     { box-shadow: 0 0 26px rgba(125,240,212,0.4); }
}

/* ---------- 受信通知 ---------- */
.notice-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 52px 72px;
  display: flex; flex-direction: column; align-items: center;
  backdrop-filter: blur(4px);
}
.notice-indicator {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 26px; font-size: 13px; letter-spacing: 0.35em; color: var(--cyan);
}
.blink-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
  animation: blink 1.1s steps(2, start) infinite;
}
@keyframes blink { 50% { opacity: 0.1; } }
.meta-rows {
  margin-bottom: 30px; font-size: 13px; letter-spacing: 0.25em;
  color: var(--text-dim); line-height: 2.4; text-align: center;
}
.meta-rows b { color: var(--blue-pale); font-weight: 400; }

/* ---------- ミナト映像フレーム ---------- */
.video-frame {
  position: relative;
  width: min(760px, 84vw);
  background: linear-gradient(180deg, rgba(10,18,32,0.9), rgba(6,10,18,0.95));
  border: 1px solid var(--line); border-radius: 6px;
  padding: 32px 40px 28px; overflow: hidden;
}
.video-frame::before {           /* 微細ノイズ＋走査線 */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom,
    rgba(255,255,255,0.03) 0 1px, transparent 1px 4px);
  animation: noiseFlicker 0.9s steps(3) infinite;
}
@keyframes noiseFlicker {
  0%   { opacity: 0.5; transform: translateY(0); }
  33%  { opacity: 0.9; transform: translateY(-1px); }
  66%  { opacity: 0.4; transform: translateY(1px); }
  100% { opacity: 0.7; transform: translateY(0); }
}
.video-hud {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; letter-spacing: 0.25em; color: var(--text-dim);
  margin-bottom: 24px;
}
.rec-badge { display: flex; align-items: center; gap: 8px; color: var(--danger); }
.rec-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--danger); box-shadow: 0 0 10px var(--danger);
  animation: blink 1s steps(2, start) infinite;
}
.timecode { font-variant-numeric: tabular-nums; color: var(--blue-pale); }

/* グリッチ風円形アバター（CSSのみ） */
.avatar {
  position: relative; width: 156px; height: 156px;
  margin: 0 auto 8px; border-radius: 50%;
  border: 1px solid rgba(111,215,255,0.45);
  background:
    radial-gradient(circle at 50% 34%, rgba(111,215,255,0.55) 0 21%, transparent 22%),
    radial-gradient(ellipse 42% 30% at 50% 88%, rgba(111,215,255,0.45) 0 60%, transparent 61%),
    radial-gradient(circle at 50% 50%, rgba(20,40,66,0.9), rgba(8,14,26,0.95));
  box-shadow: 0 0 28px rgba(111,215,255,0.18), inset 0 0 30px rgba(0,0,0,0.5);
  overflow: hidden;
  animation: avatarGlitch 4s steps(1) infinite;
}
.avatar::after {
  content: ""; position: absolute; left: 0; right: 0; height: 3px;
  background: rgba(125,240,212,0.5);
  animation: glitchLine 2.6s linear infinite;
}
@keyframes glitchLine {
  0% { top: -5%; opacity: 0; } 8% { opacity: 0.8; }
  50% { top: 60%; opacity: 0.3; } 100% { top: 105%; opacity: 0; }
}
@keyframes avatarGlitch {
  0%,91%,100% { transform: translateX(0); filter: none; }
  92% { transform: translateX(-3px); filter: hue-rotate(40deg); }
  94% { transform: translateX(2px);  filter: hue-rotate(-30deg); }
  96% { transform: translateX(0);    filter: none; }
}
.avatar-caption {
  text-align: center; font-size: 11px; letter-spacing: 0.4em;
  color: var(--text-dim); margin-bottom: 22px;
}

@keyframes lineIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- ノベルゲーム式 会話ウィンドウ ---------- */
.dlg-screen { justify-content: center; }
.dlg-visual { padding-bottom: 26px; }
.dlg-window {
  width: min(880px, 92vw);
  min-height: 176px;
  margin-top: 3.5vh;
  position: relative;
  background: rgba(6,12,24,0.92);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 26px 40px 44px;
  text-align: left;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: 0 0 34px color-mix(in srgb, var(--acc, var(--mint)) 8%, transparent);
  animation: lineIn 0.4s ease both;
}
.dlg-speaker {
  display: inline-block;
  font-size: 11px; letter-spacing: 0.35em;
  color: var(--acc, var(--mint));
  border: 1px solid color-mix(in srgb, var(--acc, var(--mint)) 40%, transparent);
  border-radius: 3px;
  padding: 5px 14px 4px;
  margin-bottom: 18px;
}
.dlg-text {
  font-size: clamp(15px, 1.5vw, 20px);
  line-height: 2.15; letter-spacing: 0.05em;
  min-height: 4.3em;
  color: var(--text);
}
.dlg-adv {
  position: absolute; right: 30px; bottom: 16px;
  color: var(--acc, var(--mint));
  font-size: 14px;
  visibility: hidden;
  animation: advBounce 1.1s ease-in-out infinite;
}
.dlg-adv .lbl {
  font-size: 10px; letter-spacing: 0.3em;
  color: var(--text-dim); margin-right: 10px;
}
@keyframes advBounce {
  0%, 100% { transform: translateY(0);   opacity: 0.95; }
  50%      { transform: translateY(5px); opacity: 0.45; }
}
.dlg-progress {
  position: absolute; left: 30px; bottom: 16px;
  font-size: 10px; letter-spacing: 0.3em;
  color: rgba(143,164,181,0.5);
}

/* ---------- 起動/ローディング ---------- */
.loading-logo {
  font-size: clamp(34px, 4.5vw, 60px); font-weight: 200;
  letter-spacing: 0.3em; text-indent: 0.3em; text-align: center;
  animation: logoPulse 2.4s ease-in-out infinite;
}
@keyframes logoPulse {
  0%,100% { opacity: 0.35; text-shadow: 0 0 10px rgba(111,215,255,0.15); }
  50%     { opacity: 1;    text-shadow: 0 0 42px rgba(111,215,255,0.55); }
}
.loading-bar {
  margin-top: 26px; width: min(420px, 60vw); height: 2px;
  background: rgba(120,200,220,0.15); overflow: hidden; border-radius: 2px;
}
.loading-bar span {
  display: block; height: 100%; width: 40%;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation: barSlide 1.4s ease-in-out infinite;
}
@keyframes barSlide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }

/* ターミナル風の逐次ログ（起動・送信演出で共用） */
.term-log {
  margin-top: 5vh; min-height: 150px;
  font-size: 14px; letter-spacing: 0.25em; line-height: 2.6;
  color: var(--mint); text-align: left;
}
.term-log div { animation: lineIn 0.4s ease both; }
.term-log .dim { color: var(--text-dim); }

/* ---------- システム音声カード ---------- */
.system-card {
  width: min(820px, 86vw);
  background: rgba(10,17,32,0.85);
  border: 1px solid var(--line); border-left: 3px solid var(--cyan);
  border-radius: 4px; padding: 42px 56px;
}
.system-label {
  font-size: 12px; letter-spacing: 0.4em; color: var(--cyan);
  margin-bottom: 26px; display: flex; align-items: center; gap: 12px;
}
.system-label::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(111,215,255,0.4), transparent);
}
.system-text {
  min-height: 120px; display: flex; align-items: center;
  font-size: clamp(16px, 1.5vw, 20px);
  line-height: 2.2; letter-spacing: 0.06em;
  animation: lineIn 0.45s ease both;
}

/* ---------- STAGE INTRO ---------- */
.stage-number {
  font-size: 14px; letter-spacing: 0.6em; text-indent: 0.6em;
  color: var(--acc); margin-bottom: 20px;
}
.stage-age {
  font-size: clamp(64px, 9vw, 128px); font-weight: 100;
  letter-spacing: 0.08em; line-height: 1;
  text-shadow: 0 0 60px rgba(125,240,212,0.3);
}
.stage-age small {
  font-size: 0.28em; letter-spacing: 0.4em; color: var(--acc);
  font-weight: 300; vertical-align: 0.5em; margin-right: 0.6em;
}
.stage-theme {
  margin-top: 4vh;
  font-size: clamp(18px, 1.9vw, 26px);
  letter-spacing: 0.1em; line-height: 1.9; text-align: center;
  color: var(--blue-pale);
}

/* ---------- ステージごとのUIモチーフ（HUDパネル） ---------- */
.hud-panel {
  width: min(560px, 80vw);
  border: 1px solid var(--acc);
  border-radius: 4px;
  background: rgba(8,14,26,0.8);
  padding: 24px 32px;
  box-shadow: 0 0 24px color-mix(in srgb, var(--acc) 18%, transparent),
              inset 0 0 20px rgba(0,0,0,0.4);
}
.hud-title {
  font-size: 13px; letter-spacing: 0.4em; color: var(--acc);
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.hud-title::before {
  content: ""; width: 8px; height: 8px;
  background: var(--acc); box-shadow: 0 0 8px var(--acc);
  animation: blink 1.6s steps(2, start) infinite;
}
.hud-row {
  display: flex; justify-content: space-between; gap: 20px;
  font-size: 13px; letter-spacing: 0.18em; line-height: 2.4;
}
.hud-row .k { color: var(--text-dim); }
.hud-row .v { color: var(--text); text-align: right; }
.hud-row .v.warn { color: var(--danger); animation: blink 1.4s steps(2, start) infinite; }

/* 生活シーンの叙述テキスト */
.scene-text {
  margin-top: 4vh; max-width: 720px;
  font-size: clamp(14px, 1.3vw, 17px);
  line-height: 2.4; letter-spacing: 0.05em;
  color: var(--text-dim); text-align: center;
}
.scene-text p { margin-bottom: 1.6em; }

/* ---------- カード選択（レンズ／断片） ---------- */
.card-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 26px; width: 100%; margin-top: 4vh;
}
@media (max-width: 900px) {
  .card-grid { grid-template-columns: 1fr; }
  #app { overflow-y: auto; justify-content: flex-start; }
}
.select-card {
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 30px 28px; cursor: pointer;
  display: flex; flex-direction: column; gap: 14px; text-align: left;
  transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s, background 0.3s;
}
.select-card:hover {
  border-color: color-mix(in srgb, var(--acc) 55%, transparent);
  transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 16px color-mix(in srgb, var(--acc) 15%, transparent);
}
.select-card.selected {
  border-color: var(--acc);
  background: color-mix(in srgb, var(--acc) 7%, transparent);
  box-shadow: 0 0 26px color-mix(in srgb, var(--acc) 35%, transparent),
              inset 0 0 18px color-mix(in srgb, var(--acc) 7%, transparent);
}
.card-tag { font-size: 11px; letter-spacing: 0.35em; color: var(--cyan); }
.select-card.selected .card-tag { color: var(--acc); }
.card-title {
  font-size: clamp(15px, 1.35vw, 19px);
  line-height: 1.8; letter-spacing: 0.04em;
}
.card-desc {
  font-size: clamp(13px, 1.05vw, 15px);
  line-height: 2; color: var(--text-dim); letter-spacing: 0.03em;
}

/* ---------- 人生の断片 詳細 ---------- */
.log-detail {
  width: min(780px, 86vw);
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 46px 58px;
}
.log-detail-title {
  font-size: clamp(19px, 1.9vw, 25px);
  letter-spacing: 0.08em; line-height: 1.8;
  margin: 18px 0 28px;
}
.log-detail-body p {
  font-size: clamp(14px, 1.3vw, 17px);
  line-height: 2.3; letter-spacing: 0.05em;
  color: var(--text-dim); margin-bottom: 14px;
}
.log-feeling {
  margin-top: 32px;
  border: 1px solid color-mix(in srgb, var(--acc) 45%, transparent);
  border-radius: 4px;
  background: color-mix(in srgb, var(--acc) 6%, transparent);
  padding: 26px 30px;
}
.log-feeling .card-tag { color: var(--acc); display: block; margin-bottom: 14px; }
.log-feeling p {
  font-size: clamp(15px, 1.45vw, 19px);
  line-height: 2.1; letter-spacing: 0.05em; color: var(--acc);
}

/* ---------- 書類・記録風パネル（部屋の記録／人生の断片） ---------- */
.doc-panel {
  width: min(760px, 86vw);
  background: rgba(10,16,28,0.9);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 40px 52px;
  text-align: left;
}
.doc-kicker {
  font-size: 11px; letter-spacing: 0.35em;
  color: var(--acc); margin-bottom: 14px;
}
.doc-title {
  font-size: clamp(17px, 1.7vw, 22px);
  letter-spacing: 0.12em; line-height: 1.8;
  border-bottom: 1px solid var(--line);
  padding-bottom: 16px; margin-bottom: 24px;
}
.doc-body p {
  font-size: clamp(14px, 1.25vw, 16px);
  line-height: 2.2; letter-spacing: 0.04em;
  color: var(--text-dim); margin-bottom: 14px;
}
.doc-body ul { list-style: none; margin: 6px 0 18px; }
.doc-body ul li {
  font-size: clamp(13px, 1.2vw, 15px);
  line-height: 2.3; letter-spacing: 0.04em;
  color: var(--text); padding-left: 1.3em; position: relative;
}
.doc-body ul li::before { content: "◦"; position: absolute; left: 0; color: var(--acc); }
.doc-quote {
  border-left: 2px solid color-mix(in srgb, var(--acc) 45%, transparent);
  padding-left: 20px; margin-top: 8px;
}
.doc-quote p { color: var(--text); }
.doc-note {
  margin-top: 22px; font-size: 12px; line-height: 2.1;
  letter-spacing: 0.05em; color: rgba(143,164,181,0.65);
  border-top: 1px dashed var(--line); padding-top: 16px;
}

/* 部屋の記録カード（確認済み表示） */
.select-card.viewed { border-style: dashed; opacity: 0.85; }
.record-check { font-size: 11px; letter-spacing: 0.3em; color: var(--acc); }
.record-hint {
  margin-top: 3vh; font-size: 12px; letter-spacing: 0.15em;
  color: var(--text-dim); text-align: center;
}

/* レンズカードの「問い」 */
.card-question {
  margin-top: 4px;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  font-size: clamp(13px, 1.05vw, 15px);
  line-height: 2; letter-spacing: 0.04em;
  color: var(--blue-pale);
}
.card-question::before {
  content: "問い";
  display: block;
  font-size: 10px; letter-spacing: 0.35em;
  color: var(--acc); margin-bottom: 8px;
}

/* ---------- LIFE DESIGN PROMPT（選び直しのための問い） ---------- */
/* この未来で当たり前になっている前提の一覧 */
.assume-panel {
  width: min(720px, 88vw);
  border: 1px solid var(--line);
  background: rgba(8,14,26,0.7);
  padding: 22px 30px;
  margin-top: 3vh;
}
.assume-item {
  font-size: clamp(13px, 1.2vw, 15px);
  line-height: 2.1; letter-spacing: 0.05em;
  color: var(--text);
  padding: 13px 4px 13px 1.7em;
  position: relative;
  border-bottom: 1px dashed var(--line);
}
.assume-item:last-child { border-bottom: none; }
.assume-item::before {
  content: "▹"; position: absolute; left: 2px;
  color: var(--acc);
}
/* 思想の注記（正しい答えではなく、問い） */
.spec-note {
  margin-top: 3.5vh; font-size: 12px; line-height: 2.3;
  letter-spacing: 0.1em; color: var(--text-dim);
  text-align: center;
}
/* 生成された問いの表示パネル */
.gen-question {
  width: min(720px, 88vw);
  margin-top: 4vh; padding: 42px 36px;
  border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent);
  background: rgba(8,14,26,0.8);
  box-shadow: 0 0 44px color-mix(in srgb, var(--acc) 12%, transparent);
  text-align: center;
}
.gen-question .q {
  font-size: clamp(17px, 1.9vw, 22px);

  line-height: 2.2; letter-spacing: 0.08em;

.gen-question .sub {
  margin-top: 24px; font-size: 12px; line-height: 2.2;
  letter-spacing: 0.06em; color: var(--text-dim);
  border-top: 1px dashed var(--line); padding-top: 18px;
}

.intro-signal {
  margin-top: 5vh;
  display: flex; align-items: center; gap: 12px;
  font-size: 11px; letter-spacing: 0.4em;
  color: var(--text-dim);
}
.intro-signal .blink-dot { background: var(--acc); box-shadow: 0 0 12px var(--acc); }

/* ---------- 2050への通信UI（プロンプト送信） ---------- */
.comm-panel {
  width: min(760px, 86vw);
  background: rgba(8,14,26,0.85);
  border: 1px solid var(--line); border-radius: 6px;
  overflow: hidden;
}
.comm-head {
  border-bottom: 1px solid var(--line);
  padding: 22px 32px;
  background: rgba(14,22,38,0.6);
}
.comm-head .hud-row { line-height: 2.2; }
.comm-body { padding: 26px 32px 32px; }
.comm-note {
  font-size: 13px; letter-spacing: 0.06em; line-height: 2;
  color: var(--text-dim); margin-bottom: 18px;
}
.comm-panel textarea {
  width: 100%; min-height: 170px;
  background: rgba(4,8,16,0.8);
  border: 1px solid var(--line); border-radius: 4px;
  color: var(--text); font-family: inherit;
  font-size: clamp(16px, 1.5vw, 20px);
  line-height: 2; letter-spacing: 0.05em;
  padding: 24px 28px; resize: vertical;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.comm-panel textarea:focus {
  outline: none; border-color: var(--acc);
  box-shadow: 0 0 18px color-mix(in srgb, var(--acc) 20%, transparent);
}
.comm-panel textarea::placeholder { color: rgba(143,164,181,0.45); }

/* ---------- 送信演出 ---------- */
.transmit-text {
  font-size: clamp(20px, 2.4vw, 32px);
  letter-spacing: 0.3em; text-indent: 0.3em;
  color: var(--mint); text-align: center;
  animation: logoPulse 1.2s ease-in-out infinite;
}

/* ---------- LIFE ARCHIVE カード ---------- */
.hint-grid { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 900px) { .hint-grid { grid-template-columns: 1fr; } }
.hint-card { cursor: default; gap: 12px; }
.hint-card:hover { transform: none; box-shadow: none; border-color: var(--line); }
.hint-age {
  font-size: 24px; font-weight: 200; letter-spacing: 0.1em; color: var(--acc);
  display: flex; align-items: baseline; gap: 14px;
}
.hint-age small { font-size: 11px; letter-spacing: 0.3em; color: var(--text-dim); }
.hint-field { font-size: 13px; line-height: 1.9; color: var(--text-dim); letter-spacing: 0.03em; }
.hint-field b { color: var(--blue-pale); font-weight: 400; }
.hint-note {
  margin-top: 6px; border-top: 1px solid var(--line); padding-top: 14px;
  font-size: clamp(13px, 1.15vw, 16px); line-height: 2;
  color: var(--text); letter-spacing: 0.04em; white-space: pre-wrap;
}
.hint-reply {
  margin-top: 6px;
  font-size: 12px; line-height: 2; letter-spacing: 0.03em;
  color: color-mix(in srgb, var(--acc) 75%, white);
  border-left: 2px solid color-mix(in srgb, var(--acc) 45%, transparent);
  padding-left: 14px;
}

/* ---------- 総括・最終画面 ---------- */
.ending-text { max-width: 720px; text-align: center; }
.ending-text p {
  font-size: clamp(15px, 1.45vw, 19px);
  line-height: 2.5; letter-spacing: 0.07em;
  margin-bottom: 2.2em;
}
.ending-text p.dim { color: var(--text-dim); }

.footnote {
  position: fixed; bottom: 18px; left: 0; right: 0;
  text-align: center; font-size: 10px; letter-spacing: 0.4em;
  color: rgba(143,164,181,0.35); pointer-events: none;
}
</style>

/* タイマーは画面遷移時に必ず破棄 */
let activeTimers = [];
function setTimer(fn, ms)  { activeTimers.push(setTimeout(fn, ms)); }
function setTicker(fn, ms) { activeTimers.push(setInterval(fn, ms)); }
function clearTimers()     { activeTimers.forEach(t => { clearTimeout(t); clearInterval(t); }); activeTimers = []; }

function go(screen, lineIndex = 0) {

  state.screen = screen;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function nl(s) { return esc(s).replace(/\n/g, "<br>"); }

function stage() { return STAGES[state.stageIndex]; }
function lensOf(st) { return st.lenses.find(l => l.id === state.selectedLens); }

function stageFragments(st) {

}
function fragmentOf(st) { return stageFragments(st)[state.selectedFragment]; }
/* responsesByLens があればレンズ別の反応を、なければ共通 response を返す */

/* ============================================================
   ノベルゲーム式テキスト表示
   - 1文字ずつタイプライター表示（句読点で軽い間）
   - 表示中にクリック：全文を即表示
   - 全文表示後にクリック：次のブロックへ
   ============================================================ */

let typing = false;     // タイプライター表示中か
let typeSkip = null;    // 表示中に呼ぶと全文を即表示する関数

function typeText(el, text, done) {
  const chars = [...text];
  let pos = 0;
  typing = true;
  const finish = () => {
    typing = false;
    typeSkip = null;
    el.innerHTML = nl(text);
    if (done) done();
  };
  typeSkip = finish;
  (function step() {
    if (!typing) return;
    if (pos >= chars.length) { finish(); return; }
    pos++;
    el.innerHTML = nl(chars.slice(0, pos).join(""));
    const c = chars[pos - 1];
    /* 句点・感嘆・省略記号で長めの間、読点・改行で短い間 */
    const wait = "。！？…".includes(c) ? 240 : ("、\n".includes(c) ? 110 : 26);
    setTimer(step, wait);
  })();
}

/* 会話画面（映像フレーム＋画面下部の会話ウィンドウ）
   opts:
   - st       : ステージ（アクセント色用。共通画面は null）
   - speaker  : 話者名（MINATO / SYSTEM VOICE など）
   - blocks   : テキストブロック配列（state.lineIndex で送る）
   - hudRight : 映像HUD右側の表記（null で映像フレームなし）
   - onFinish : 全ブロック読了後の遷移
   - lastLabel: 最終ブロックの▼に添える小さなラベル（省略可） */
function dialogueScreen(opts) {
  const i = state.lineIndex;
  const blocks = opts.blocks;
  const isLast = i === blocks.length - 1;
  const visual = opts.hudRight ? `
    <div class="video-frame dlg-visual">
      <div class="video-hud">
        <span class="rec-badge"><span class="rec-dot"></span>REC</span>
        <span>${opts.hudRight}</span>
        <span class="timecode" id="timecode">00:00:00:00</span>
      </div>
      <div class="avatar"></div>
      <div class="avatar-caption">VIDEO SIGNAL // 2050</div>
    </div>` : "";
  const inner = `
    ${visual}
    <div class="dlg-window" id="dlgWin">
      <div class="dlg-speaker">${esc(opts.speaker)}</div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="dlg-adv" id="dlgAdv">${isLast && opts.lastLabel ? `<span class="lbl">${esc(opts.lastLabel)}</span>` : ""}▼</div>
      <div class="dlg-progress">${i + 1} / ${blocks.length}</div>
    </div>`;
  app.innerHTML = opts.st
    ? accWrap(opts.st, inner, "screen dlg-screen")
    : `<div class="screen dlg-screen">${inner}</div>`;
  if (opts.hudRight) startTimecode(i * 90);
  const adv = document.getElementById("dlgAdv");
  typeText(document.getElementById("dlgText"), blocks[i], () => {
    adv.style.visibility = "visible";
  });
  /* ウィンドウ全体がクリック可能：表示中→全文表示／表示後→次へ */
  document.getElementById("dlgWin").onclick = () => {
    if (typing) { typeSkip(); return; }
    if (isLast) { opts.onFinish(); return; }
    state.lineIndex++;
    render();
  };
}

/* タイムコード風カウンター（映像フレーム表示中のみ動作） */
function startTimecode(startFrames) {
  const tcEl = document.getElementById("timecode");
  if (!tcEl) return;
  let frames = startFrames;
  setTicker(() => {
    frames++;
    const pad = n => String(n).padStart(2, "0");
    tcEl.textContent =
      `00:${pad(Math.floor(frames / 1800) % 60)}:${pad(Math.floor(frames / 30) % 60)}:${pad(frames % 30)}`;
  }, 33);
}

/* ターミナル風ログを1行ずつ表示し、完了後に done() を呼ぶ */
function playTermLog(el, lines, stepMs, done) {
  lines.forEach((line, i) => {
    setTimer(() => {
      const div = document.createElement("div");
      div.textContent = "▸ " + line;
      if (i === lines.length - 1) div.classList.add("dim");
      el.appendChild(div);
      if (i === lines.length - 1 && done) setTimer(done, stepMs);
    }, i * stepMs);
  });
}

    app.innerHTML = accWrap(st, `
      <div class="eyebrow">Stage ${st.stageNumber} — Age ${st.age} / Life Fragment</div>
      <p class="h-mid">選択されたSIMULATION LENSに基づき、<br>ミナトの人生の断片が生成されました。</p>
      <p class="lead" style="margin-top:14px;">SIMULATION LENS：${esc(lens.title)}<br>どの断片を確認しますか？</p>
      <div class="card-grid">
        ${frags.map((f, fi) => `
          <div class="select-card ${state.selectedFragment === fi ? "selected" : ""}" data-frag="${fi}">
            <span class="card-tag">LIFE FRAGMENT ${esc(f.code || f.id || fi + 1)}</span>
            <div class="card-title">${esc(f.title)}</div>
            <div class="card-desc">${nl(f.summary)}</div>
          </div>`).join("")}
      </div>
      <div class="actions">
        <button class="btn" id="btnRead" ${state.selectedFragment !== null ? "" : "disabled"}>READ FRAGMENT</button>
      </div>`, "screen scrollable");

    app.querySelectorAll("[data-frag]").forEach(card => {
      card.onclick = () => { state.selectedFragment = Number(card.dataset.frag); render(); };
    });
    document.getElementById("btnRead").onclick = () => {
      if (state.selectedFragment === null) return;
      go("lifeFragmentDetail");
    };
  },

  /* ---------- 6-5. LIFE FRAGMENT詳細 ---------- */
  lifeFragmentDetail() {
    const st = stage();
    const frag = fragmentOf(st);
    const tag = `LIFE FRAGMENT ${frag.code || frag.id || ""} — AGE ${st.age}`;
    /* docTitle があれば「通知・ログなどのメディア断片」として表示 */
    const docHead = frag.docTitle
      ? `<div class="doc-kicker">${esc(tag)} ／ ${esc(frag.title)}</div>
         <div class="doc-title">${esc(frag.docTitle)}</div>`
      : `<span class="card-tag">${esc(tag)}</span>
         <h2 class="log-detail-title">${esc(frag.title)}</h2>`;
    app.innerHTML = accWrap(st, `
      <div class="log-detail">
        ${docHead}
        <div class="log-detail-body">
          ${frag.body.map(p => `<p>${nl(p)}</p>`).join("")}
        </div>
        <div class="log-feeling">
          <span class="card-tag">ミナトに残った感覚</span>
          <p>${nl(frag.feeling)}</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnWrite">CREATE PROMPT<span class="btn-jp">選び直しのための問いをつくる</span></button>
      </div>`, "screen scrollable");
    document.getElementById("btnWrite").onclick = () => {
      state.selectedAssumption = null;
      state.selectedLoss = null;
      go("promptBuilder", 0);
    };
  },

  /* ---------- 6-6. LIFE DESIGN PROMPT（選び直しのための問い）
       state.lineIndex をステップ番号として使う
       0：この未来で当たり前になっていることを表示
       1：疑う前提を選ぶ
       2：失われそうなものを選ぶ（→生成演出）
       3：生成された問いを確認する
       4：ミナトへ送る言葉として編集し、送信する ---------- */
  promptBuilder() {
    const st = stage();
    const spec = specOf(st);
    const step = state.lineIndex;

    /* STEP 0：この未来で当たり前になっていること */
    if (step === 0) {
      app.innerHTML = accWrap(st, `
        <div class="eyebrow">Life Design Prompt ／ 選び直しのための問い</div>
        <p class="h-mid">この未来では、<br>次のことが当たり前になっています。</p>
        <div class="assume-panel">
          ${spec.assumptions.map(a => `<div class="assume-item">${nl(a.text)}</div>`).join("")}
        </div>
        <p class="spec-note">FUTURE SIMULATORが2050年へ送るのは、正しい答えではありません。<br>助言ではなく、違和感を。解決策ではなく、選び直しの余白を。</p>
        <div class="actions">
          <button class="btn" id="btnDoubt">DOUBT THE PREMISE<span class="btn-jp">前提を疑う</span></button>
        </div>`, "screen scrollable");
      document.getElementById("btnDoubt").onclick = () => go("promptBuilder", 1);
      return;
    }

    /* STEP 1：疑う前提の選択 */
    if (step === 1) {
      app.innerHTML = accWrap(st, `
        <div class="eyebrow">Step 1 — Doubt</div>
        <p class="h-mid">2026年のあなたから見て、<br>どの前提を疑いますか？</p>
        <div class="card-grid" style="grid-template-columns:1fr; max-width:720px;">
          ${spec.assumptions.map((a, i) => `
            <div class="select-card ${state.selectedAssumption === i ? "selected" : ""}" data-assume="${i}">
              <p class="card-desc">${nl(a.text)}</p>
            </div>`).join("")}
        </div>
        <div class="actions">
          <button class="btn" id="btnNext" ${state.selectedAssumption !== null ? "" : "disabled"}>NEXT<span class="btn-jp">この前提を疑う</span></button>
        </div>`, "screen scrollable");
      app.querySelectorAll("[data-assume]").forEach(card => {
        card.onclick = () => { state.selectedAssumption = Number(card.dataset.assume); render(); };
      });
      document.getElementById("btnNext").onclick = () => {
        if (state.selectedAssumption === null) return;
        go("promptBuilder", 2);
      };
      return;
    }

    /* STEP 2：失われそうなものの選択 → 問いの生成演出 */
    if (step === 2) {
      const a = spec.assumptions[state.selectedAssumption];
      app.innerHTML = accWrap(st, `
        <div class="eyebrow">Step 2 — Loss</div>
        <p class="h-mid">「${esc(a.text)}」<br>——その前提によって、何が失われそうですか？</p>
        <div class="card-grid" style="grid-template-columns:1fr; max-width:720px;">
          ${spec.losses.map((l, i) => `
            <div class="select-card ${state.selectedLoss === i ? "selected" : ""}" data-loss="${i}">
              <p class="card-desc">${nl(l)}</p>
            </div>`).join("")}
        </div>
        <div class="actions">
          <button class="btn" id="btnGen" ${state.selectedLoss !== null ? "" : "disabled"}>GENERATE PROMPT<span class="btn-jp">問いを生成する</span></button>
        </div>`, "screen scrollable");
      app.querySelectorAll("[data-loss]").forEach(card => {
        card.onclick = () => { state.selectedLoss = Number(card.dataset.loss); render(); };
      });
      document.getElementById("btnGen").onclick = () => {
        if (state.selectedLoss === null) return;
        clearTimers();
        app.innerHTML = accWrap(st, `
          <div class="transmit-text">GENERATING LIFE DESIGN PROMPT...</div>
          <div class="loading-bar" style="margin-top:4vh;"><span></span></div>`);
        setTimer(() => go("promptBuilder", 3), 1800);
      };
      return;
    }

    /* STEP 3：生成された問い */
    if (step === 3) {
      const a = spec.assumptions[state.selectedAssumption];
      const loss = spec.losses[state.selectedLoss];
      app.innerHTML = accWrap(st, `
        <div class="eyebrow">Generated Prompt</div>
        <p class="h-mid">未来へ残す、<br>選び直しのための問い。</p>
        <div class="gen-question">
          <p class="q">${nl(a.question)}</p>
          <div class="sub">疑った前提：${esc(a.text)}<br>失われそうなもの：${esc(loss)}</div>
        </div>
        <div class="actions">
          <button class="btn" id="btnRedo">RESELECT<span class="btn-jp">選び直す</span></button>
          <button class="btn" id="btnDraft">WRITE TO MINATO<span class="btn-jp">この問いをミナトへ</span></button>
        </div>`, "screen scrollable");
      document.getElementById("btnRedo").onclick = () => go("promptBuilder", 1);
      document.getElementById("btnDraft").onclick = () => go("promptBuilder", 4);
      return;
    }

    /* STEP 4：ミナトへ送る言葉として編集・送信 */
    const a = spec.assumptions[state.selectedAssumption];
    const loss = spec.losses[state.selectedLoss];
    app.innerHTML = accWrap(st, `
      <div class="eyebrow">Outgoing Transmission</div>
      <p class="h-mid">問いを、<br>ミナトへ送る言葉に。</p>
      <div class="comm-panel">
        <div class="comm-head">
          <div class="hud-row"><span class="k">TO</span><span class="v">MINATO / 2050</span></div>
          <div class="hud-row"><span class="k">FROM</span><span class="v">YOU / 2026</span></div>
          <div class="hud-row"><span class="k">SUBJECT</span><span class="v">LIFE DESIGN PROMPT — 選び直しのための問い</span></div>
        </div>
        <div class="comm-body">
          <p class="comm-note">あなたの選択から、送信文の下書きを生成しました。<br>このまま送っても、自分の言葉に書き換えても構いません。</p>
          <textarea id="promptText" style="min-height:300px;"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnTransmit">TRANSMIT TO 2050</button>
      </div>`, "screen scrollable");

    const ta = document.getElementById("promptText");
    const btn = document.getElementById("btnTransmit");
    ta.value = buildPromptDraft(a, loss);
    /* 入力が空のあいだは送信できない */
    ta.addEventListener("input", () => { btn.disabled = ta.value.trim().length === 0; });
    btn.onclick = () => {
      const note = ta.value.trim();
      if (!note) return;
      const frag = fragmentOf(st);
      state.hints.push({
        age: st.age,
        motifName: st.motif.name,
        lensTitle: lensOf(st).title,
        fragmentTitle: (frag.code ? frag.code + "：" : "") + frag.title,
        assumption: a.text,
        loss,
        question: a.question,
        note,
        response: stageResponse(st).join("\n")
      });
      persist();
      /* 送信演出 → ミナトの反応へ */
      clearTimers();
      app.innerHTML = accWrap(st, `
        <div class="transmit-text">TRANSMITTING TO 2050...</div>
        <div class="loading-bar" style="margin-top:4vh;"><span></span></div>
        <div class="term-log" id="txLog"></div>`);
      playTermLog(document.getElementById("txLog"), TRANSMIT_LINES, 750,
        () => go("minatoResponse"));
    };
  },

  /* ---------- 6-7. ミナトの反応 ---------- */
  minatoResponse() {
    const st = stage();
    dialogueScreen({
      st,
      speaker: "MINATO",
      blocks: stageResponse(st),
      hudRight: `REPLY SIGNAL&nbsp;&nbsp;MINATO (${st.age})`,
      onFinish: () => go("archiveSaved")
    });
  },

  /* ---------- 6-8. LIFE ARCHIVE保存 ---------- */
  archiveSaved() {
    const st = stage();
    const h = state.hints[state.hints.length - 1];
    const isLastStage = state.stageIndex === STAGES.length - 1;
    app.innerHTML = accWrap(st, `
      <div class="eyebrow">Life Archive</div>
      <p class="h-mid">Age ${st.age} のミナトへの<br>「選び直しのための問い」として保存されました。</p>
      <div class="card-grid hint-grid" style="max-width:640px; grid-template-columns:1fr;">
        <div class="select-card hint-card">
          <div class="hint-age">AGE ${h.age}<small>SCENE：${esc(h.motifName)}</small></div>
          <div class="hint-field"><b>SIMULATION LENS</b><br>${esc(h.lensTitle)}</div>
          <div class="hint-field"><b>LIFE FRAGMENT</b><br>${esc(h.fragmentTitle)}</div>
          <div class="hint-field"><b>DOUBTED PREMISE</b><br>${esc(h.assumption)}</div>
          <div class="hint-field"><b>LIFE DESIGN PROMPT</b><br>${nl(h.question)}</div>
          <div class="hint-field"><b>MESSAGE FROM 2026</b></div>
          <div class="hint-note">${esc(h.note)}</div>
          <div class="hint-field"><b>MINATO RESPONSE</b></div>
          <div class="hint-reply">${nl(h.response)}</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnNext">${isLastStage ? "COMPLETE SIMULATION" : "NEXT STAGE"}</button>
      </div>`, "screen scrollable");
    document.getElementById("btnNext").onclick = () => {
      if (isLastStage) { go("simulationComplete"); return; }
      state.stageIndex++;
      state.selectedLens = null;
      state.selectedFragment = null;
      state.selectedAssumption = null;
      state.selectedLoss = null;
      state.viewedRecords = [];
      state.openRecord = null;
      go("stageIntro", -1);
    };
  },

  /* ---------- 10-11. SIMULATION COMPLETE（LIFE ARCHIVE一覧） ---------- */
  simulationComplete() {
    app.innerHTML = `
      <div class="screen scrollable">
        <div class="eyebrow" style="--acc:var(--mint)">Life Archive — 4 Prompts Stored</div>
        <h1 class="h-large" style="letter-spacing:0.3em;">SIMULATION<br>COMPLETE</h1>
        <p class="lead" style="margin-top:3vh;">あなたが残した4つの問いをもとに、<br>ミナトの人生シミュレーションが完了しました。</p>
        <div class="card-grid hint-grid">
          ${state.hints.map((h, idx) => `
            <div class="select-card hint-card" style="--acc:${STAGES[idx] ? STAGES[idx].accent : "var(--mint)"}">
              <div class="hint-age">AGE ${h.age}<small>${esc(h.motifName)}</small></div>
              <div class="hint-field"><b>SIMULATION LENS</b><br>${esc(h.lensTitle)}</div>
              <div class="hint-field"><b>LIFE DESIGN PROMPT</b><br>${nl(h.question)}</div>
              <div class="hint-field"><b>MESSAGE FROM 2026</b></div>
              <div class="hint-note">${esc(h.note)}</div>
            </div>`).join("")}
        </div>
        <div class="actions">
          <button class="btn" id="btnNext">NEXT</button>
        </div>
      </div>`;
    document.getElementById("btnNext").onclick = () => go("lifeSummary");
  },

  /* ---------- 12. ミナトの人生総括 ---------- */
  lifeSummary() {
    dialogueScreen({
      st: null,
      speaker: "LIFE RECORD — MINATO",
      blocks: LIFE_SUMMARY,
      hudRight: null,
      onFinish: () => go("minatoFinalReply")
    });
  },

  /* ---------- 13. 18歳のミナトから最後の返信 ---------- */
  minatoFinalReply() {
    dialogueScreen({
      st: null,
      speaker: "MINATO",
      blocks: MINATO_FINAL_REPLY,
      hudRight: "RECONNECTED&nbsp;&nbsp;MINATO (18)",
      onFinish: () => go("finalQuestion")
    });
  },

  /* ---------- 14. 体験者への最後の問い ---------- */
  finalQuestion() {
    app.innerHTML = `
      <div class="screen">
        <div class="eyebrow" style="--acc:var(--mint)">Final Question</div>
        <div class="ending-text">
          ${FINAL_QUESTION_TEXT.map(p => `<p>${nl(p)}</p>`).join("")}
        </div>
        <div class="comm-panel" style="margin-top:1vh;">
          <div class="comm-head">
            <div class="hud-row"><span class="k">TO</span><span class="v">MINATO / 2050</span></div>
            <div class="hud-row"><span class="k">SUBJECT</span><span class="v">FINAL QUESTION</span></div>
          </div>
          <div class="comm-body">
            <textarea id="finalText" placeholder="あなたのアイデアを、ここに残してください"></textarea>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="btnSave" disabled>SAVE FINAL QUESTION</button>
        </div>
      </div>`;
    const ta = document.getElementById("finalText");
    const btn = document.getElementById("btnSave");
    ta.focus();
    ta.addEventListener("input", () => { btn.disabled = ta.value.trim().length === 0; });
    btn.onclick = () => {
      const answer = ta.value.trim();
      if (!answer) return;
      state.finalAnswer = answer;
      persist();
      go("finalSaved");
    };
  },

  /* ---------- 15. 最終保存・RESET ---------- */
  finalSaved() {
    app.innerHTML = `
      <div class="screen">
        <div class="transmit-text">TRANSMITTING TO 2050...</div>
        <div class="loading-bar" style="margin-top:5vh;"><span></span></div>
      </div>`;
    setTimer(() => {
      app.innerHTML = `
        <div class="screen">
          <div class="eyebrow" style="--acc:var(--mint)">Transmission Complete</div>
          <p class="h-mid">未来への問いとして保存されました。</p>
          <p class="lead" style="margin-top:4vh;">
            あなたが残した問いと言葉は、<br>
            2050年のミナトに届けられます。<br><br>
            体験していただき、ありがとうございました。
          </p>
          <div class="actions">
            <button class="btn btn-sub" id="btnReset">RESET</button>
          </div>
        </div>`;
      document.getElementById("btnReset").onclick = () => {
        state = initialState();
        go("standby");
      };
    }, 2200);
  }
};

/* ============================================================
   起動
   ============================================================ */

function render() {
  clearTimers();
  typing = false;
  typeSkip = null;
  screens[state.screen]();
}

render();
</script>
</body>
</html>
